name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            label: windows-x64
          - os: ubuntu-24.04
            target: --linux --x64
            label: linux-x64
          - os: macos-15-intel
            target: --mac --x64
            label: macos-intel
          - os: macos-15
            target: --mac --arm64
            label: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify packaged tool runtime
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node_modules/.bin/electron . --smoke-test
          else
            node_modules/.bin/electron . --smoke-test
          fi
      - run: npm run dist -- ${{ matrix.target }}
        if: runner.os != 'macOS'
      - name: Build macOS (Developer ID when configured)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run dist -- ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify bundled updater and official feed
        run: node scripts/verify-update-config.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Flusiva-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: Flusiva-*
          path: build-artifacts
      - name: Prepare update feeds, architectures and checksums
        run: node scripts/prepare-release.cjs build-artifacts installers
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "La Release è già pubblicata: non sovrascrivo gli installer."
            exit 1
          elif [ "$existing" = "true" ]; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Flusiva $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md --draft
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
