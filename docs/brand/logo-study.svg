<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#f7faff"/><text x="64" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1761e8">FLUSIVA / STUDIO DEL MARCHIO</text><text x="64" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600" fill="#11223d">Un segno fatto di piccoli flussi.</text><text x="64" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#5b6980">Tre direzioni per un’app desktop. Blu, azzurro e bianco. Un simbolo che funziona anche a 16 pixel.</text><rect x="64" y="220" width="416" height="380" rx="20" fill="#fff" stroke="#1761e8"/><g transform="translate(96 252) scale(1.75)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="20" cy="19" r="4.5" fill="#fff"/><circle cx="32" cy="19" r="4.5" fill="#fff"/><circle cx="20" cy="31" r="4.5" fill="#fff"/><circle cx="32" cy="31" r="4.5" fill="#fff"/><circle cx="20" cy="43" r="4.5" fill="#fff"/><circle cx="44" cy="19" r="4.5" fill="#75d1ff"/><circle cx="44" cy="43" r="2.5" fill="#75d1ff"/></g><text x="96" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#11223d">A · Flusso</text><text x="96" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1761e8">Direzione scelta</text><text x="96" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">La F rende riconoscibile il nome.</text><text x="96" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">Il punto azzurro apre la sequenza.</text><rect x="512" y="220" width="416" height="380" rx="20" fill="#fff" stroke="#dce5f1"/><g transform="translate(544 252) scale(1.75)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="18" cy="26" r="4" fill="#fff"/><circle cx="18" cy="38" r="4" fill="#fff"/><circle cx="32" cy="14" r="4" fill="#fff"/><circle cx="32" cy="26" r="4" fill="#fff"/><circle cx="32" cy="38" r="4" fill="#fff"/><circle cx="32" cy="50" r="4" fill="#fff"/><circle cx="46" cy="26" r="4" fill="#75d1ff"/><circle cx="46" cy="38" r="4" fill="#75d1ff"/></g><text x="544" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#11223d">B · Traccia</text><text x="544" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1761e8">Alternativa</text><text x="544" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">Una forma vicina al suono.</text><text x="544" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">Meno distintiva per un’app video.</text><rect x="960" y="220" width="416" height="380" rx="20" fill="#fff" stroke="#dce5f1"/><g transform="translate(992 252) scale(1.75)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="32" cy="14" r="4" fill="#fff"/><circle cx="32" cy="26" r="4" fill="#fff"/><circle cx="32" cy="38" r="4" fill="#fff"/><circle cx="20" cy="32" r="4" fill="#fff"/><circle cx="44" cy="32" r="4" fill="#fff"/><circle cx="20" cy="50" r="4" fill="#75d1ff"/><circle cx="32" cy="50" r="4" fill="#75d1ff"/><circle cx="44" cy="50" r="4" fill="#75d1ff"/></g><text x="992" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#11223d">C · Download</text><text x="992" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#1761e8">Alternativa</text><text x="992" y="501" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">L’azione è immediatamente leggibile.</text><text x="992" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6980">Più generica come marchio.</text><rect x="64" y="632" width="864" height="300" rx="20" fill="#11223d"/><g transform="translate(96 668) scale(1.375)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="20" cy="19" r="4.5" fill="#fff"/><circle cx="32" cy="19" r="4.5" fill="#fff"/><circle cx="20" cy="31" r="4.5" fill="#fff"/><circle cx="32" cy="31" r="4.5" fill="#fff"/><circle cx="20" cy="43" r="4.5" fill="#fff"/><circle cx="44" cy="19" r="4.5" fill="#75d1ff"/><circle cx="44" cy="43" r="2.5" fill="#75d1ff"/></g><text x="208" y="731" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="650" fill="#fff">flusiva.</text><text x="96" y="804" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#b5d5ff">Simbolo, wordmark e icona di sistema</text><text x="96" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b5d5ff">64 px</text><g transform="translate(96 852) scale(1)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="20" cy="19" r="4.5" fill="#fff"/><circle cx="32" cy="19" r="4.5" fill="#fff"/><circle cx="20" cy="31" r="4.5" fill="#fff"/><circle cx="32" cy="31" r="4.5" fill="#fff"/><circle cx="20" cy="43" r="4.5" fill="#fff"/><circle cx="44" cy="19" r="4.5" fill="#75d1ff"/><circle cx="44" cy="43" r="2.5" fill="#75d1ff"/></g><text x="192" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b5d5ff">32 px</text><g transform="translate(192 852) scale(0.5)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="20" cy="19" r="4.5" fill="#fff"/><circle cx="32" cy="19" r="4.5" fill="#fff"/><circle cx="20" cy="31" r="4.5" fill="#fff"/><circle cx="32" cy="31" r="4.5" fill="#fff"/><circle cx="20" cy="43" r="4.5" fill="#fff"/><circle cx="44" cy="19" r="4.5" fill="#75d1ff"/><circle cx="44" cy="43" r="2.5" fill="#75d1ff"/></g><text x="264" y="838" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b5d5ff">16 px</text><g transform="translate(264 852) scale(0.25)"><rect width="64" height="64" rx="18" fill="#1761e8"/><circle cx="20" cy="19" r="4.5" fill="#fff"/><circle cx="32" cy="19" r="4.5" fill="#fff"/><circle cx="20" cy="31" r="4.5" fill="#fff"/><circle cx="32" cy="31" r="4.5" fill="#fff"/><circle cx="20" cy="43" r="4.5" fill="#fff"/><circle cx="44" cy="19" r="4.5" fill="#75d1ff"/><circle cx="44" cy="43" r="2.5" fill="#75d1ff"/></g><text x="968" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#11223d">La palette</text><rect x="968" y="704" width="44" height="44" rx="12" fill="#1761e8" stroke="#dce5f1"/><text x="1030" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#11223d">Blu / azione</text><text x="1030" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6980">#1761E8</text><rect x="968" y="771" width="44" height="44" rx="12" fill="#75d1ff" stroke="#dce5f1"/><text x="1030" y="793" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#11223d">Azzurro / dettaglio</text><text x="1030" y="813" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6980">#75D1FF</text><rect x="968" y="838" width="44" height="44" rx="12" fill="#ffffff" stroke="#dce5f1"/><text x="1030" y="860" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#11223d">Bianco / spazio</text><text x="1030" y="880" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6980">#FFFFFF</text></svg>